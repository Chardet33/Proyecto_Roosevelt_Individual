<div class="dashboard-wrapper">
    <div class="container">
        <aside>
            <div class="logo">
                <span class="material-symbols-outlined accent">explore</span>
                <h2>Geo<span class="accent">Admin</span></h2>
            </div>
            <nav class="sidebar">
                <a routerLink="/dashboard/rutas" routerLinkActive="active" class="nav-link">
                    <span class="material-symbols-outlined">route</span> Rutas
                </a>

                <a routerLink="/dashboard/zonas" routerLinkActive="active" class="nav-link">
                    <span class="material-symbols-outlined">map</span> Zonas
                </a>
                <a routerLink="/dashboard/objetos" routerLinkActive="active" class="nav-link">
                    <span class="material-symbols-outlined">location_on</span> Objetos
                </a>

                <a routerLink="/dashboard/usuarios" routerLinkActive="active" class="nav-link">
                    <span class="material-symbols-outlined">group</span> Usuarios
                </a>

                <div class="sidebar-divider"></div>

                <a (click)="logout()" class="nav-link logout" style="cursor: pointer;">
                    <span class="material-symbols-outlined">logout</span> Cerrar Sesión
                </a>
            </nav>
        </aside>

        <main> 
            <div class="dynamic-container">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
